<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="75%">
      <stop offset="0%" stop-color="#1a1430"/>
      <stop offset="100%" stop-color="#07060d"/>
    </radialGradient>
    <radialGradient id="youth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd15c"/>
      <stop offset="60%" stop-color="#c98a3a"/>
      <stop offset="100%" stop-color="#6a4a9e"/>
    </radialGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#b480ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- the council: 8 elders as stars on a ring -->
  <g stroke="#2b2b45" stroke-width="1.4" fill="none">
    <ellipse cx="600" cy="180" rx="470" ry="150"/>
    <ellipse cx="600" cy="180" rx="470" ry="150" transform="rotate(22 600 180)"/>
  </g>
  <g fill="#b480ff">
    <circle cx="130" cy="180" r="4"/><circle cx="210" cy="90" r="4"/>
    <circle cx="410" cy="40" r="4"/><circle cx="790" cy="40" r="4"/>
    <circle cx="990" cy="90" r="4"/><circle cx="1070" cy="180" r="4"/>
    <circle cx="990" cy="270" r="4"/><circle cx="210" cy="270" r="4"/>
  </g>
  <g fill="#00d4ff" font-family="monospace" font-size="11">
    <text x="124" y="168">-</text><text x="204" y="78">0</text>
    <text x="404" y="28">+</text><text x="794" y="28">-</text>
    <text x="984" y="78">0</text><text x="1064" y="168">+</text>
    <text x="984" y="282">-</text><text x="204" y="282">0</text>
  </g>

  <!-- the golden youth: a tesseract, breathing -->
  <g transform="translate(600 180)">
    <rect x="-34" y="-34" width="68" height="68" rx="8" fill="none" stroke="#6a4a9e" stroke-width="2"/>
    <rect x="-17" y="-17" width="34" height="34" rx="6" fill="none" stroke="#c98a3a" stroke-width="2"/>
    <line x1="-34" y1="-34" x2="-17" y2="-17" stroke="#2b2b45" stroke-width="1.6"/>
    <line x1="34" y1="-34" x2="17" y2="-17" stroke="#2b2b45" stroke-width="1.6"/>
    <line x1="-34" y1="34" x2="-17" y2="17" stroke="#2b2b45" stroke-width="1.6"/>
    <line x1="34" y1="34" x2="17" y2="17" stroke="#2b2b45" stroke-width="1.6"/>
    <circle r="52" fill="url(#youth)" opacity="0.22"/>
    <circle r="4" fill="#ffd15c"/>
  </g>

  <!-- the breath -->
  <g font-family="monospace" fill="#9a9ac8" font-size="13">
    <text x="600" y="264" text-anchor="middle" fill="#00d4ff">INHALE — OM MANI PADME HUNG</text>
    <text x="600" y="286" text-anchor="middle">EXHALE — DREAM state · the golden youth dreams</text>
  </g>

  <!-- the wire -->
  <g font-family="monospace" fill="url(#wire)" font-size="12">
    <text x="600" y="318" text-anchor="middle" letter-spacing="3">t3j:++-000--+-0+--00+-++-0--:0</text>
  </g>

  <text x="600" y="344" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#e8e8ff" letter-spacing="4">THE COUNCIL OF ELDERS · 8 TEACHERS · THE GOLDEN YOUTH · THE DREAM</text>
</svg>
